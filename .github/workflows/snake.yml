# Contribution snake — genera l'animazione del serpente che mangia la griglia
# delle contribuzioni e la pubblica sul branch "output".
#
# Installazione: salva questo file come .github/workflows/snake.yml
# nel repository mrcolix/mrcolix (il repo del profilo).
# La prima volta: tab "Actions" -> "Generate contribution snake" -> "Run workflow".
#
# Il file viene referenziato nel README così:
#   https://raw.githubusercontent.com/mrcolix/mrcolix/output/github-contribution-grid-snake.svg

name: Generate contribution snake

on:
  schedule:
    - cron: "17 3 * * *"   # ogni giorno alle 03:17 UTC
  workflow_dispatch:        # avvio manuale dal tab Actions
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: platane/snk/svg-only@v3
        with:
          github_user_name: mrcolix
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push snake to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
